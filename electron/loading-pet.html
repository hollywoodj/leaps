<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pocket Pet</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #d95d58;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
      }
      .egg {
        width: 72px;
        height: 92px;
        margin: 0 auto 18px;
        border: 3px solid #fff;
        border-radius: 50% 50% 46% 46% / 42% 42% 58% 58%;
        box-sizing: border-box;
        box-shadow: inset 8px 6px 0 rgba(255, 255, 255, 0.28);
      }
      p {
        margin: 0;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 12px;
        opacity: 0.88;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="egg" aria-hidden="true"></div>
      <p>Opening Pocket Pet…</p>
    </div>
  </body>
</html>
