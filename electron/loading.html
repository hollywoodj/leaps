<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Leaps</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b3d8c;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border: 3px solid #fff;
        border-radius: 50%;
        display: grid;
        grid-template-columns: repeat(3, 10px);
        gap: 6px;
        align-items: end;
        justify-content: center;
        padding: 16px 0 14px;
        box-sizing: border-box;
      }
      .mark span {
        display: block;
        width: 10px;
        background: #fff;
        border-radius: 5px;
      }
      .mark span:nth-child(1) { height: 14px; }
      .mark span:nth-child(2) { height: 22px; }
      .mark span:nth-child(3) { height: 30px; }
      p {
        margin: 0;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <p>Opening Leaps…</p>
    </div>
  </body>
</html>
